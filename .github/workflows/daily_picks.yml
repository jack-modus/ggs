name: Daily Picks

on:
  schedule:
    # Every 15 min, 04:00-20:00 UTC. GitHub delays the FIRST tick of each day's
    # window by 2-3.5hrs in practice, so starting at 04:00 (not 06:00) aims to
    # land the actual first run by ~7-8am BST instead of ~9-10:30am.
    - cron: '*/15 4-20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-picks
  cancel-in-progress: false   # let runs queue rather than clobber each other

jobs:
  daily-picks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch racecard from SportingLife
        run: python fetch_racecard_sl.py

      - name: Generate picks
        run: |
          RACECARD=$(ls *racecard.csv 2>/dev/null | sort | tail -1)
          if [ -z "$RACECARD" ]; then
            echo "No racecard found."; exit 0
          fi
          python predict_actions.py "$RACECARD"

      - name: Commit and push picks page
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add docs/index.html
          git diff --staged --quiet && echo "No changes" && exit 0

          # docs/index.html is fully regenerated every run (not incrementally
          # edited), so a rebase against another run's commit almost always
          # conflicts line-for-line. Instead: always take OUR freshly-generated
          # content and just replay it on top of whatever main currently is,
          # retrying if another run pushes in the meantime.
          #
          # IMPORTANT: on retry, do a HARD reset to the new origin/main, not a
          # soft one. `reset --soft` only moves HEAD -- it leaves the index
          # and working tree exactly as they were, so any tracked file this
          # job didn't explicitly re-stage (predict_actions.py, model bundles,
          # lookups_v6.pkl) stays at THIS job's original stale checkout. The
          # next commit then bakes that stale content back in as a child of
          # the newer commit -- silently reverting whatever the run that beat
          # us to push had just updated. Confirmed happening in production on
          # 5-7 Aug 2026: 2 days of a stale lookups_v6.pkl/model refresh
          # silently undone this way. Hard reset avoids the whole bug class --
          # every retry starts from a byte-exact copy of origin/main, with
          # ONLY docs/index.html's fresh content reapplied on top.
          cp docs/index.html /tmp/fresh_index.html
          for i in 1 2 3 4 5; do
            git commit -m "picks $(date -u '+%Y-%m-%d %H:%M UTC')"
            if git push origin main; then
              echo "Pushed on attempt $i"
              exit 0
            fi
            echo "Push rejected (attempt $i) — retrying with latest main"
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/fresh_index.html docs/index.html
            git add docs/index.html
            sleep 3
          done
          echo "Failed to push after 5 attempts"
          exit 1
