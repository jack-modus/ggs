name: Daily Picks

on:
  schedule:
    - cron: '30 6 * * *'   # 7:30 AM BST daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-picks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch racecard from SportingLife
        run: python fetch_racecard_sl.py

      - name: Generate picks
        run: |
          RACECARD=$(ls *racecard.csv 2>/dev/null | sort | tail -1)
          if [ -z "$RACECARD" ]; then
            echo "No racecard found."; exit 0
          fi
          python predict_actions.py "$RACECARD"

      - name: Commit and push picks page
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add docs/index.html
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "picks $(date '+%Y-%m-%d %H:%M UTC')"
          git push
