name: Daily Picks

on:
  schedule:
    # Every 15 min, 06:00-20:00 UTC (7am-9pm BST) — covers all GB/IRE racing
    - cron: '*/15 6-20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-picks
  cancel-in-progress: false   # let runs queue rather than clobber each other

jobs:
  daily-picks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch racecard from SportingLife
        run: python fetch_racecard_sl.py

      - name: Generate picks
        run: |
          RACECARD=$(ls *racecard.csv 2>/dev/null | sort | tail -1)
          if [ -z "$RACECARD" ]; then
            echo "No racecard found."; exit 0
          fi
          python predict_actions.py "$RACECARD"

      - name: Commit and push picks page
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add docs/index.html
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "picks $(date '+%Y-%m-%d %H:%M UTC')"
          # pull --rebase first in case another run pushed in between
          git pull --rebase origin main
          git push
