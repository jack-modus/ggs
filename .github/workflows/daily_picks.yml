name: Daily Picks

on:
  schedule:
    # 6:30 AM UTC = 7:30 AM BST
    - cron: '30 6 * * *'
  workflow_dispatch:   # manual trigger from the Actions tab

jobs:
  daily-picks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch racecard from Betfair
        env:
          BETFAIR_USERNAME: ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD: ${{ secrets.BETFAIR_PASSWORD }}
          BETFAIR_APP_KEY:  ${{ secrets.BETFAIR_APP_KEY }}
        run: python fetch_racecard_actions.py

      - name: Generate picks
        run: |
          RACECARD=$(ls *racecard.csv 2>/dev/null | sort | tail -1)
          if [ -z "$RACECARD" ]; then
            echo "No racecard found — no races today or fetch failed."
            exit 0
          fi
          python predict_actions.py "$RACECARD"

      - name: Get today's date
        id: date
        run: echo "label=$(date '+%A %d %B %Y')" >> $GITHUB_OUTPUT

      - name: Email picks
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_ADDRESS }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "Racing Picks — ${{ steps.date.outputs.label }}"
          to: jackgrobertson@gmail.com
          from: Racing Picks <${{ secrets.GMAIL_ADDRESS }}>
          html_body: file://docs/index.html
